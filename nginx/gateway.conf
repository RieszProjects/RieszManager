# Public entry point: routes /api and /ws to the backend, everything else to the frontend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the scheme reported by an upstream TLS terminator (e.g. Cloudflare Tunnel).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 210m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Strict-Transport-Security $hsts always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
